plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'vn.dnse.openapi'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    example {
        java.srcDir 'src/example/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

configurations {
    exampleImplementation.extendsFrom implementation
    exampleRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'org.msgpack:jackson-dataformat-msgpack:0.9.9'
    implementation 'org.slf4j:slf4j-api:2.0.16'

    exampleRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}

tasks.named('test') {
    dependsOn tasks.named(sourceSets.example.classesTaskName)
    useJUnitPlatform()
}

tasks.register('run', JavaExec) {
    group = 'application'
    description = 'Run the DNSE realtime market-data WebSocket example'
    dependsOn tasks.named(sourceSets.example.classesTaskName)
    classpath = sourceSets.example.runtimeClasspath
    mainClass = 'vn.dnse.openapi.examples.MarketDataExample'
    standardInput = System.in
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
